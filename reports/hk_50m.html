  <script>
    // Parser Logic
    // 「🧊 已趋于平稳推荐（规则…）」→「已趋于平稳推荐」：去掉开头 emoji 和括号里的规则。
    function groupLabel(heading) {
      return heading
        .replace(/^##\s*/, '')
        .replace(/^[^\p{L}\p{N}]+/u, '')
        .split('（')[0]
        .trim();
    }

    function parseData(md) {
      const stocks = [];
      // 卡片分组 = 它上方最近的一个 `## ` 标题。只影响展示，顺序仍按 markdown 原样。
      const blocks = [];
      let group = '';
      for (const line of md.split('\n')) {
        if (line.startsWith('## ')) {
          group = groupLabel(line);
        } else if (line.startsWith('### ')) {
          blocks.push({ group, lines: [line.slice(4)] });
        } else if (blocks.length > 0) {
          blocks[blocks.length - 1].lines.push(line);
        }
      }

      for (const block of blocks) {
        const lines = block.lines.map(l => l.trim()).filter(l => l);
        if (lines.length === 0) continue;

        const titleLine = lines[0];
        const idMatch = titleLine.match(/(\d+)\.\s+`?([A-Za-z0-9._-]+)`?/);
        if (!idMatch) continue;
        
        const id = idMatch[1];
        const ticker = idMatch[2];
        
        let industry = '', price = '', volume = '', turnover = '', volRatio = '', volAnomaly = '';
        let todayChange = '', dropIntensity = '', marketCap = '', pe = '', pb = '', score = '';

        for (const line of lines.slice(1)) {
          if (line.includes('基础：')) {
            const match = line.match(/行业：(.*?)$/);
            if (match) industry = match[1].trim();
          }
          if (line.includes('所属行业')) {
            const match = line.match(/所属行业.*?：(.+)$/);
            if (match) industry = match[1].trim();
          }
          if (line.includes('行情与成交：')) {
            const pMatch = line.match(/收盘价 \`(.*?)\`/);
            if (pMatch) price = pMatch[1];
            const vMatch = line.match(/成交量 \`(.*?)\`/);
            if (vMatch) volume = vMatch[1];
            const tMatch = line.match(/成交额 \`(.*?)\`/);
            if (tMatch) turnover = tMatch[1];
          }
          if (line.includes('最新现价')) {
            const pMatch = line.match(/最新现价.*?\`(.*?)\`/);
            if (pMatch) price = pMatch[1];
            const mMatch = line.match(/总市值.*?\`(.*?)\`/);
            if (mMatch) marketCap = mMatch[1];
          }
          if (line.includes('成交活跃度')) {
            const tMatch = line.match(/今日成交额\s*\`(.*?)\`/);
            if (tMatch) turnover = tMatch[1];
          }
          if (line.includes('量价特征：')) {
            const vrMatch = line.match(/量比 \`(.*?)\`/);
            if (vrMatch) volRatio = vrMatch[1];
            const vaMatch = line.match(/量能异常 \`(.*?)\`/);
            if (vaMatch) volAnomaly = vaMatch[1];
          }
          if (line.includes('量能') && !line.includes('量价特征')) {
            const values = [...line.matchAll(/\`(.*?)\`/g)].map(match => match[1]);
            if (values.length > 0 && line.includes('今日成交量')) volume = values[0];
            if (values.length > 0 && line.includes('近 20 日中位数')) volRatio = values[values.length - 1];
          }
          if (line.includes('三日走势：')) {
            const cMatch = line.match(/今日 \`(.*?)\`/);
            if (cMatch) todayChange = cMatch[1];
            const dMatch = line.match(/跌幅强度 \`(.*?)\`/);
            if (dMatch) dropIntensity = dMatch[1];
          }
          if (line.includes('三日信号') || line.includes('四日信号') || line.includes('两日涨跌')) {
            const todayMatch = line.match(/(?:\*\*T\*\*|今日(?:\(T\))?)\s*\`(.*?)\`/);
            if (todayMatch) todayChange = todayMatch[1];
            const dMatch = line.match(/最大跌幅\s*\`(.*?)\`/);
            if (dMatch) dropIntensity = dMatch[1];
          }
          if (line.includes('估值：')) {
            const mMatch = line.match(/总市值 \`(.*?)\`/);
            if (mMatch) marketCap = mMatch[1];
            const peMatch = line.match(/PE \`(.*?)\`/);
            if (peMatch) pe = peMatch[1];
            const pbMatch = line.match(/PB \`(.*?)\`/);
            if (pbMatch) pb = pbMatch[1];
          }
          if (line.includes('估值指标')) {
            const peMatch = line.match(/PE\s*\`(.*?)\`/);
            if (peMatch) pe = peMatch[1];
            const pbMatch = line.match(/PB\s*\`(.*?)\`/);
            if (pbMatch) pb = pbMatch[1];
          }
          if (line.includes('策略校验：')) {
            const sMatch = line.match(/综合评分 \`(.*?)\`/);
            if (sMatch) score = sMatch[1];
          }
          if (line.includes('综合评分')) {
            const sMatch = line.match(/综合评分\*\*：\*\*(.*?)\*\*/);
            if (sMatch) score = sMatch[1];
          }
        }
        
        stocks.push({
          id, ticker, group: block.group, industry, price, volume, turnover, volRatio, volAnomaly,
          todayChange, dropIntensity, marketCap, pe, pb, score,
          rawLines: lines.slice(1)
        });
      }
      return stocks;
    }

    let allStocks = [];

    function renderCards(data) {

        // 将 Markdown 明细转换为安全、易读的中文分行信息
        const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({

        const formatDetailLine = line => {

        };
        const rawHtml = stock.rawLines.map(line => {
          const cleanText = line.replace(/\*\*/g, '').replace(/`/g, '');
          const isHighlight = cleanText.includes('大跌条件') || cleanText.includes('综合评分') || cleanText.includes('今日');
          const detailClass = isHighlight ? 'p-2 rounded-xl bg-zinc-50 border border-zinc-100' : 'px-0';
          return `<div class="${detailClass} flex flex-col gap-1">${formatDetailLine(line)}</div>`;
        }).join('<div class="h-2"></div>');

        // Card Container
        const card = document.createElement('div');
        // Staggered entrance
        card.style.animationDelay = `${index * 0.05}s`;
        card.className = "fade-in bg-white rounded-[24px] p-5 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.03)] border border-zinc-200/70 flex flex-col";
        
        card.innerHTML = `
          <!-- Top Row -->
          <div class="flex justify-between items-start">
            <div class="flex flex-col gap-1.5">
              <div class="flex items-center gap-2.5 flex-wrap">
                <h2 class="text-2xl font-extrabold text-zinc-950 tracking-tight leading-none">${stock.ticker}</h2>
                <span class="font-mono text-[10px] font-bold text-zinc-500 bg-zinc-100 px-2 py-1 rounded-md leading-none border border-zinc-200/50">#${stock.id}</span>
                ${stock.group ? `<span class="self-start text-[10px] font-bold text-sky-700 bg-sky-50 px-2 py-1 rounded-md leading-none border border-sky-100">${escapeHtml(stock.group)}</span>` : ''}
              </div>
              <p class="text-xs text-zinc-400 font-semibold truncate max-w-[200px]">${stock.industry}</p>
            </div>
            
            <div class="flex flex-col items-end gap-1.5">
              <div class="bg-zinc-900 text-white font-mono font-bold text-[15px] px-3 py-1.5 rounded-lg leading-none shadow-sm">
                ${stock.score}
              </div>
              <span class="text-[9px] text-zinc-400 font-extrabold uppercase tracking-[0.2em] leading-none">评分</span>
            </div>
          </div>
          
          <!-- Metrics Grid -->
          <div class="mt-6 grid grid-cols-2 gap-y-5 gap-x-4">
            <div class="flex flex-col gap-1.5">
              <span class="text-[10px] text-zinc-400 font-extrabold uppercase tracking-widest leading-none">最新价</span>
              <div class="flex items-center gap-2">
                <span class="font-mono font-bold text-zinc-900 text-[15px] leading-none">${stock.price}</span>
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded border ${changeColor} ${changeBg} leading-none">${stock.todayChange}</span>
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-[10px] text-zinc-400 font-extrabold uppercase tracking-widest leading-none">量比</span>
              <div class="flex items-center gap-1.5">
                <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 text-zinc-300"></i>
                <span class="font-mono font-bold text-zinc-900 text-[15px] leading-none">${stock.volRatio}</span>
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-[10px] text-zinc-400 font-extrabold uppercase tracking-widest leading-none">成交额</span>
              <span class="font-mono font-bold text-zinc-900 text-[15px] leading-none">${stock.turnover}</span>
            </div>
            <div class="flex flex-col gap-1.5">
              <span class="text-[10px] text-zinc-400 font-extrabold uppercase tracking-widest leading-none">总市值</span>
              <span class="font-mono font-bold text-zinc-900 text-[15px] leading-none">${stock.marketCap}</span>
            </div>
          </div>
          
          <!-- Expand Divider & Button -->
          <div class="mt-6 pt-1 border-t border-zinc-100 border-dashed">
            <button class="expand-btn w-full flex items-center justify-between text-[11px] font-bold text-zinc-400 uppercase tracking-widest py-3 hover:text-zinc-900 transition-colors active:scale-[0.98] outline-none">
              <span>查看数据</span>
              <i data-lucide="plus" class="w-4 h-4 transition-transform duration-300"></i>
            </button>
            
            <!-- Accordion Details -->
            <div class="accordion-content">
              <div class="accordion-inner">
                <div class="pb-2 pt-1 flex flex-col gap-1">
                  ${rawHtml}
                </div>
              </div>
            </div>
          </div>
        `;
        
        // Attach Interaction
        const expandBtn = card.querySelector('.expand-btn');
        const detailsPanel = card.querySelector('.accordion-content');
        const icon = expandBtn.querySelector('i');
        
        expandBtn.addEventListener('click', () => {
          const isOpen = detailsPanel.classList.contains('open');
          if (isOpen) {
            detailsPanel.classList.remove('open');
            icon.style.transform = 'rotate(0deg)';
          } else {
            detailsPanel.classList.add('open');
            icon.style.transform = 'rotate(45deg)';
          }
        });

        container.appendChild(card);
      });
      
      lucide.createIcons();
    }

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Fetch & Parse
      const rawMarkdown = document.getElementById('raw-data').textContent;
      allStocks = parseData(rawMarkdown);
      
      // 2. Initial Render
      renderCards(allStocks);

      // 3. Search Filter
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allStocks.filter(stock =>
          stock.ticker.toLowerCase().includes(query) ||
          stock.industry.toLowerCase().includes(query) ||
          stock.group.toLowerCase().includes(query)
        );
        renderCards(filtered);
      });
    });
  </script>
</body>
</html>
