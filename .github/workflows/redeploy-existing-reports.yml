name: Redeploy existing HTML reports

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload existing HTML reports
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports

      - name: Deploy existing HTML reports
        id: deployment
        uses: actions/deploy-pages@v4
