name: Publish and send previous US 144 report

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send report link through PushPlus
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          REPORT_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/send_report_link.py
