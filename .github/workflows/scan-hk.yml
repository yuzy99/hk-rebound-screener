name: HK full-market scan

run-name: HK full-market scan and report (${{ github.event_name }})

on:
  # GitHub Actions cron uses UTC. 08:30 UTC = 16:30 Beijing/Hong Kong time,
  # after the regular Hong Kong session has closed.
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: "重新建立港股行业元数据缓存"
        required: false
        default: false
        type: boolean

permissions:
  # 部署会整体替换站点：港股报告也必须进仓库，才不会被美股那次部署抹掉。
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hk-full-market-scan
  cancel-in-progress: false

env:
  TZ: Asia/Hong_Kong
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # git pull --rebase 需要 merge base，浅克隆没有。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare and restore market-data caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/yfinance_cache
            data/akshare_cache
            ~/.cache/py-yfinance
          key: ${{ runner.os }}-hk-market-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hk-market-cache-

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run HK full-market latest strategy
        env:
          PYTHONPATH: src
          REPORT_HTML_PATH: reports/hk_latest.html
          REPORT_TEMPLATE_PATH: templates/stock_report_template.html
        run: |
          CONFIG_FILE="config.hk.two_day_drop.json"
          echo "Using config file: $CONFIG_FILE"

          args=(
            --mode live
            --full-market
            --config "$CONFIG_FILE"
            --metadata-cache data/cache/hk_industry.csv
            --output-dir outputs
          )
          if [ "${{ inputs.refresh_metadata }}" = "true" ]; then
            args+=(--refresh-metadata)
          fi
          python -m hk_rebound_screener.main "${args[@]}"

      - name: Commit published reports
        continue-on-error: true        # 推送撞车绝不能挡住部署和通知
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && { echo "报告无变化"; exit 0; }
          git commit -m "chore(report): publish HK report $(TZ=Asia/Hong_Kong date +%F) [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "推送被拒，rebase 重试 ($i)"; git pull --rebase origin main || true
          done
          echo "WARN: 报告推送失败，本次部署可能不含最新报告"

      - name: Sync reports with main before deploy
        run: |
          git fetch origin main
          git merge --no-edit origin/main || git checkout origin/main -- reports/
          ls -la reports/

      - name: Configure GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload HK HTML report
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports

      - name: Deploy HK HTML report
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push HK codes and report link
        if: success()
        env:
          PYTHONPATH: src
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          REPORT_PAGE_URL: https://yuzy99.github.io/hk-rebound-screener/hk_latest.html
        run: python scripts/send_report_link.py --market HK --csv-glob 'outputs/scan_hk_*.csv'

      - name: Upload HK scan CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hk-scan-${{ github.run_number }}
          path: outputs/*.csv
          if-no-files-found: warn
          retention-days: 14
