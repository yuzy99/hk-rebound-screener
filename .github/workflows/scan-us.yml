name: US full-market scan

run-name: US full-market scan (${{ github.event_name }})

on:
  # GitHub Actions cron uses UTC. 21:30 UTC is after the US close in both
  # daylight-saving and standard time, and is 05:30 the next day in Taipei.
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: Rebuild the US industry metadata cache before scanning
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: us-full-market-scan
  cancel-in-progress: false

env:
  TZ: Asia/Taipei
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore market-data caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            ~/.cache/py-yfinance
          key: ${{ runner.os }}-us-market-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-us-market-cache-

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run the existing US full-market strategy
        env:
          PYTHONPATH: src
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          args=(
            --mode live
            --full-market
            --config config.us.json
            --metadata-cache data/cache/us_industry.csv
            --output-dir outputs
          )
          if [ "${{ inputs.refresh_metadata }}" = "true" ]; then
            args+=(--refresh-metadata)
          fi
          python -m hk_rebound_screener.main "${args[@]}"

      - name: Upload US scan CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-scan-${{ github.run_number }}
          path: outputs/*.csv
          if-no-files-found: warn
          retention-days: 14
