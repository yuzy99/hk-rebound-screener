name: US full-market scan

run-name: US full-market scan and report (${{ github.event_name }})

on:
  # GitHub Actions cron uses UTC. Beijing/Hong Kong time is UTC+8.
  # 00:00 UTC is 08:00 on workdays; 06:00 UTC is 14:00 on Saturday.
  schedule:
    - cron: "0 0 * * 0-4"
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: Rebuild the US industry metadata cache before scanning
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-scanner-us
  cancel-in-progress: false

env:
  TZ: Asia/Hong_Kong
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore market-data caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            ~/.cache/py-yfinance
          key: ${{ runner.os }}-us-market-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-us-market-cache-

      - name: Restore yfinance history cache
        uses: actions/cache/restore@v4
        with:
          path: data/yfinance_cache
          key: yfinance-us-${{ github.run_id }}
          restore-keys: |
            yfinance-us-

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run US full-market latest strategy
        env:
          PYTHONPATH: src
          REPORT_HTML_PATH: reports/us_latest.html
          REPORT_TEMPLATE_PATH: templates/stock_report_template.html
        run: |
          CONFIG_FILE="config.us.two_day_drop.json"
          echo "Using config file: $CONFIG_FILE"
          args=(
            --mode live
            --full-market
            --config "$CONFIG_FILE"
            --metadata-cache data/cache/us_industry.csv
            --output-dir outputs
          )
          if [ "${{ inputs.refresh_metadata }}" = "true" ]; then
            args+=(--refresh-metadata)
          fi
          python -m hk_rebound_screener.main "${args[@]}"

      - name: Configure GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload US HTML report
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports

      - name: Deploy US HTML report
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push US codes and report link
        if: success()
        env:
          PYTHONPATH: src
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          REPORT_PAGE_URL: https://yuzy99.github.io/hk-rebound-screener/us_latest.html
        run: python scripts/send_report_link.py --market US --csv-glob 'outputs/scan_us_*.csv'

      - name: Save yfinance history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/yfinance_cache
          key: yfinance-us-${{ github.run_id }}

      - name: Upload US scan CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-scan-${{ github.run_number }}
          path: outputs/*.csv
          if-no-files-found: warn
          retention-days: 14
